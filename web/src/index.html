<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>GARAH — Douala vers Bangui</title>

  <!-- ⚠️ `viewport-fit=cover` : sans lui, la barre de navigation du bas passe
       sous l'encoche des téléphones récents et devient intouchable. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Commandez à Douala, retirez à Bangui.">
  <meta name="theme-color" content="#6366f1">

  <base href="/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!--
    La police est chargée en second plan, jamais en bloquant.

    ⚠️ `display=swap` est indispensable ici : sur une connexion lente, une
       police bloquante laisse un écran VIDE le temps qu'elle arrive. Avec
       `swap`, le texte s'affiche tout de suite dans la police de repli, puis
       se substitue. C'est le contraire du confort d'un bureau — c'est la
       différence entre lire et attendre.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /*
     * L'écran d'attente, écrit ICI et non dans un composant.
     *
     * 🎯 Il doit s'afficher AVANT qu'Angular n'existe : c'est tout son rôle.
     *    Le mettre dans un composant reviendrait à l'afficher après le
     *    téléchargement du JavaScript, c'est-à-dire à ne rien couvrir du tout.
     *
     * Angular remplace le contenu de <gb-racine> à son démarrage, et cet
     * écran disparaît alors de lui-même. Aucun code ne l'efface.
     */
    /*
     * ⚠️ On ne consulte PAS `prefers-color-scheme` ici.
     *
     *    Le thème vient du petit script en fin de <head>, qui pose
     *    `data-theme` avant le premier rendu. Une règle média ajoutée ici
     *    reprendrait la main sur le choix de l'utilisateur, et le bouton de
     *    bascule paraîtrait cassé sur un système réglé en sombre.
     */
    :root { color-scheme: light; }
    :root[data-theme='dark'] { color-scheme: dark; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f8fafc;
      color: #0f172a;
      font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    /* `:root` EST <html> : on le cible lui-même, pas un descendant. */
    :root[data-theme='dark'],
    :root[data-theme='dark'] body { background: #0c0c14; color: #f3f4f6; }

    .attente {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .attente__nom {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .attente__trait {
      width: 96px;
      height: 3px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.18);
      overflow: hidden;
    }

    .attente__trait::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 9999px;
      background: #6366f1;
      animation: glisse 1.1s ease-in-out infinite;
    }

    @keyframes glisse {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    /* Un mouvement perpétuel est pénible pour qui y est sensible. */
    @media (prefers-reduced-motion: reduce) {
      .attente__trait::after { animation: none; width: 100%; }
    }
  </style>

  <!--
    Le thème, posé AVANT le premier pixel.

    🎯 Sans ce script, la page s'affiche en clair puis bascule au démarrage
       d'Angular — un clignotement que tout le monde remarque et que personne
       ne sait expliquer. Il doit donc rester ICI, en ligne et synchrone : un
       fichier séparé arriverait trop tard.

    ⚠️ Le défaut est le CLAIR, et non `prefers-color-scheme`. Une boutique se
       regarde comme une vitrine : photos sur fond clair, prix en noir sur
       blanc. Suivre le système donnait le sombre à tout téléphone réglé ainsi,
       et la boutique n'avait jamais l'air de ce qu'on avait dessiné.

    Le try/catch n'est pas décoratif : en navigation privée, lire
    `localStorage` LÈVE une exception sur certains navigateurs, et une
    exception ici laisserait la page sans thème du tout.
  -->
  <script>
    (function () {
      var theme = 'light';
      try {
        if (localStorage.getItem('garah.theme') === 'sombre') { theme = 'dark'; }
      } catch (e) { /* stockage bloqué : on garde le clair */ }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <gb-racine>
    <div class="attente">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.5 21 7v10l-9 4.5L3 17V7l9-4.5Z" stroke="#12a594" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 7.5 16.5 10v4L12 16.5 7.5 14v-4L12 7.5Z" fill="#12a594"/>
      </svg>
      <span class="attente__nom">GARAH</span>
      <span class="attente__trait"></span>
    </div>
  </gb-racine>
</body>
</html>
